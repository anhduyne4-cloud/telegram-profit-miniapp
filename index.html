
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Shop OLA Proxy</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0f1116; --card:#181b22; --line:#242833;
    --text:#e8ecf3; --muted:#8b93a7;
    --pri:#22a7f0; --ok:#22c55e; --err:#ef4444;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--text);font-size:14px;padding-bottom:80px}
  .wrap{padding:12px;max-width:600px;margin:0 auto}
  .top{display:flex;justify-content:space-between;align-items:center;padding:10px 4px}
  .top h1{margin:0;font-size:16px}
  .badge{font-size:11px;padding:3px 8px;border-radius:6px;background:#2a2f3a;color:var(--muted)}
  .bal{background:linear-gradient(135deg,#22a7f0,#1e40af);border-radius:14px;
       padding:16px;margin-bottom:14px}
  .bal small{opacity:.85;font-size:12px}
  .bal b{display:block;font-size:24px;margin-top:4px}
  .head{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 10px}
  .head b{font-size:14px}
  .btn{background:var(--pri);color:#fff;border:0;border-radius:9px;
       padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer}
  .btn:active{opacity:.7}
  .btn.block{display:block;width:100%;padding:13px;font-size:15px;margin-top:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:12px;margin-bottom:10px}
  .prod{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .prod .name{font-weight:600;font-size:14px;word-break:break-word}
  .prod .meta{color:var(--muted);font-size:11px;margin-top:3px}
  .prod .price{color:var(--ok);font-weight:700;font-size:15px;white-space:nowrap}
  .center{text-align:center;padding:28px;color:var(--muted);font-size:13px}
  .pill{display:inline-block;padding:2px 7px;border-radius:6px;background:#2a2f3a;
        color:var(--muted);font-size:11px;margin-left:6px}
  .pill.on{background:#14532d;color:#86efac}
  .debug{background:#0d1016;border:1px solid var(--line);border-radius:8px;
         padding:10px;font-family:ui-monospace,monospace;font-size:11px;
         color:#cbd5e1;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-top:8px}
  input{width:100%;background:#0d1016;border:1px solid var(--line);color:var(--text);
        padding:11px 12px;border-radius:9px;font-size:15px;margin-bottom:8px;outline:none}
  input:focus{border-color:var(--pri)}
  .row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .row .btn{flex:1;min-width:70px}
  .tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--card);padding:4px;border-radius:12px}
  .tabs button{flex:1;background:transparent;border:0;color:var(--muted);padding:10px;
               border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
  .tabs button.on{background:var(--pri);color:#fff}
  .hide{display:none}
  .qr{text-align:center;padding:14px}
  .qr img{max-width:260px;width:100%;border-radius:10px;background:#fff;padding:10px}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;text-align:left}
  .kv:last-child{border:0}
  .kv span:last-child{font-weight:600;text-align:right;margin-left:10px;word-break:break-all}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
         background:#111827;border:1px solid var(--line);padding:10px 16px;border-radius:10px;
         font-size:13px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90%}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🛒 Shop OLA Proxy</h1>
    <span class="badge" id="uname">—</span>
  </div>

  <div class="bal">
    <small>💰 Số dư khả dụng</small>
    <b id="balance">— đ</b>
    <small style="margin-top:6px;display:block">💵 Đã nạp: <span id="totalDep">0 đ</span></small>
  </div>

  <div class="tabs">
    <button class="on" id="tab-btn-products" onclick="switchTab('products')">📦 Sản phẩm</button>
    <button id="tab-btn-deposit" onclick="switchTab('deposit')">💵 Nạp tiền</button>
  </div>

  <!-- TAB: SẢN PHẨM -->
  <div id="tab-products">
    <div class="head">
      <b>Danh sách sản phẩm</b>
      <button class="btn" onclick="loadProducts()">↻ Tải lại</button>
    </div>
    <div id="products-list"><div class="center">Đang tải sản phẩm từ OLA...</div></div>
  </div>

  <!-- TAB: NẠP TIỀN -->
  <div id="tab-deposit" class="hide">
    <div class="card">
      <div style="margin-bottom:8px"><b>💵 Nạp tiền qua VietQR</b></div>
      <input id="dep-amount" type="number" inputmode="numeric" placeholder="Số tiền (tối thiểu 20.000đ)" />
      <div class="row">
        <button class="btn" onclick="quickDep(20000)">20k</button>
        <button class="btn" onclick="quickDep(50000)">50k</button>
        <button class="btn" onclick="quickDep(100000)">100k</button>
        <button class="btn" onclick="quickDep(200000)">200k</button>
      </div>
      <button class="btn block" onclick="createDeposit()">Tạo mã QR nạp tiền</button>
    </div>
    <div id="dep-result"></div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let USER_ID = null;
let depPollTimer = null;

function fmt(n){ return (Number(n)||0).toLocaleString("vi-VN") + " đ"; }

function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(msg, ms=2500){
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), ms);
}

function init(){
  if (!tg || !tg.initDataUnsafe?.user) {
    document.body.innerHTML =
      '<div class="center" style="padding-top:80px">❌ Vui lòng mở Mini App từ trong bot Telegram.</div>';
    return;
  }
  USER_ID = tg.initDataUnsafe.user.id;
  document.getElementById("uname").textContent =
    "@" + (tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name || USER_ID);

  loadUser();
  loadProducts();
}

function switchTab(name){
  document.getElementById("tab-products").classList.toggle("hide", name !== "products");
  document.getElementById("tab-deposit").classList.toggle("hide", name !== "deposit");
  document.getElementById("tab-btn-products").classList.toggle("on", name === "products");
  document.getElementById("tab-btn-deposit").classList.toggle("on", name === "deposit");
  if (name === "deposit") loadUser();
}

async function loadUser(){
  try{
    const r = await fetch(`/api/user?id=${USER_ID}`);
    const j = await r.json();
    if (j.success){
      document.getElementById("balance").textContent = fmt(j.user.balance);
      document.getElementById("totalDep").textContent = fmt(j.user.total_deposited);
    }
  }catch(e){ console.error(e); }
}

async function loadProducts(){
  const box = document.getElementById("products-list");
  box.innerHTML = '<div class="center">⏳ Đang tải sản phẩm từ OLA...</div>';
  try{
    const r = await fetch("/api/ola/products");
    const j = await r.json();
    if (!j.success){
      box.innerHTML = `
        <div class="card" style="border-color:var(--err)">
          <b style="color:var(--err)">❌ Lỗi lấy sản phẩm</b>
          <div style="margin-top:8px;color:var(--muted);font-size:12px">${esc(j.message||'Không xác định')}</div>
          ${j.raw_preview ? `<div class="debug">${esc(j.raw_preview)}</div>` : ''}
        </div>`;
      return;
    }
    if (!j.products.length){
      box.innerHTML = `
        <div class="card">
          <b>⚠️ OLA trả về nhưng chưa parse được sản phẩm</b>
          <div style="margin-top:6px;color:var(--muted);font-size:12px">Xem raw response để chỉnh _normalize_ola_products():</div>
          ${j.raw_preview ? `<div class="debug">${esc(j.raw_preview)}</div>` : ''}
        </div>`;
      return;
    }
    box.innerHTML = `<div style="margin-bottom:6px;color:var(--muted);font-size:12px">
        Tìm thấy <b style="color:var(--text)">${j.products.length}</b> sản phẩm
      </div>` +
      j.products.map(p => `
        <div class="card">
          <div class="prod">
            <div style="min-width:0">
              <div class="name">${esc(p.name)}</div>
              <div class="meta">
                ID: <code>${esc(p.id)}</code>
                <span class="pill ${p.stock > 0 ? 'on' : ''}">Kho: ${p.stock}</span>
              </div>
            </div>
            <div class="price">${fmt(p.price)}</div>
          </div>
        </div>
      `).join("");
  }catch(e){
    box.innerHTML = `<div class="card" style="border-color:var(--err)">
      <b style="color:var(--err)">❌ Không kết nối được backend</b>
      <div style="margin-top:6px;color:var(--muted);font-size:12px">${esc(e.message)}</div>
    </div>`;
  }
}

function quickDep(v){
  document.getElementById("dep-amount").value = v;
}

async function createDeposit(){
  const amt = parseInt(document.getElementById("dep-amount").value);
  if (!amt || amt < 20000){ toast("⚠️ Tối thiểu 20.000đ"); return; }

  const box = document.getElementById("dep-result");
  box.innerHTML = '<div class="center">⏳ Đang tạo QR...</div>';

  try{
    const r = await fetch("/api/deposit/create", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user_id: USER_ID, amount: amt})
    });
    const j = await r.json();
    if (!j.success){
      box.innerHTML = `<div class="card" style="border-color:var(--err)">
        <b style="color:var(--err)">❌ ${esc(j.message)}</b>
      </div>`;
      return;
    }
    box.innerHTML = `
      <div class="card qr">
        <img src="${j.qr_data_url}" alt="QR" />
        <div style="margin-top:12px">
          <div class="kv"><span>Ngân hàng</span><span>${esc(j.bank)}</span></div>
          <div class="kv"><span>Số TK</span><span>${esc(j.account_no)}</span></div>
          <div class="kv"><span>Chủ TK</span><span>${esc(j.account_name)}</span></div>
          <div class="kv"><span>Số tiền</span><span style="color:var(--ok)">${fmt(j.amount)}</span></div>
          <div class="kv"><span>Nội dung CK</span><span>${esc(j.memo)}</span></div>
        </div>
        <div style="margin-top:12px;color:var(--muted);font-size:12px">
          ⏳ Quét QR và chuyển khoản đúng nội dung.<br/>
          Hệ thống tự động cộng tiền trong ~10-30 giây.
        </div>
      </div>`;
    startDepositPoll(j.key);
  }catch(e){
    box.innerHTML = `<div class="card" style="border-color:var(--err)">
      <b style="color:var(--err)">❌ ${esc(e.message)}</b>
    </div>`;
  }
}

function startDepositPoll(key){
  if (depPollTimer) clearInterval(depPollTimer);
  let ticks = 0;
  depPollTimer = setInterval(async () => {
    ticks++;
    if (ticks > 40) { clearInterval(depPollTimer); return; }
    try{
      const r = await fetch(`/api/deposit/status/${key}`);
      const j = await r.json();
      if (j.status === "gone"){
        clearInterval(depPollTimer);
        await loadUser();
        toast("✅ Nạp tiền thành công!");
        document.getElementById("dep-result").innerHTML =
          '<div class="card" style="border-color:var(--ok)"><b style="color:var(--ok)">✅ Nạp tiền thành công! Số dư đã được cộng.</b></div>';
      }
    }catch(e){}
  }, 5000);
}

init();
</script>
</body>
</html>
