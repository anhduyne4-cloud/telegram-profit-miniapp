<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Proxy Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
:root{--bg:#0f1117;--card:#1a1d28;--card2:#232735;--border:#2a2f3e;--text:#e8ecf4;--muted:#8b93a8;--primary:#4a9eff;--success:#25d366;--danger:#ff4757;--gold:#ffd700}
body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px;font-size:14px}
.header{padding:16px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.logo{font-weight:700;font-size:18px;background:linear-gradient(135deg,#4a9eff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.balance-badge{background:var(--card2);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;border:1px solid var(--border)}
.balance-badge span{color:var(--success)}
.page{padding:16px;display:none}
.page.active{display:block}
.section-title{font-size:16px;font-weight:700;margin:8px 0 12px;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;transition:.2s}
.card:active{transform:scale(.98)}
.product-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.product-name{font-weight:600;font-size:15px;line-height:1.3;flex:1}
.stock-tag{background:rgba(37,211,102,.15);color:var(--success);font-size:11px;padding:3px 8px;border-radius:6px;font-weight:600;white-space:nowrap}
.product-desc{color:var(--muted);font-size:12px;margin-bottom:10px;line-height:1.4}
.product-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{color:var(--gold);font-weight:700;font-size:16px}
.price small{color:var(--muted);font-weight:400;font-size:11px}
.btn{background:linear-gradient(135deg,#4a9eff,#357ae8);color:#fff;border:none;padding:9px 18px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.5}
.btn-success{background:linear-gradient(135deg,#25d366,#1ea953)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-gold{background:linear-gradient(135deg,#ffd700,#f0a500);color:#000}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-block{width:100%;padding:13px;font-size:15px;border-radius:12px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.5}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.tab{padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;font-size:13px;white-space:nowrap;cursor:pointer;font-weight:500}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-bg.active{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:20px;max-height:85vh;overflow-y:auto;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.close-x{background:var(--card2);border:none;color:var(--muted);width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer}
.input{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:10px;font-size:15px;outline:none;margin-bottom:12px}
.input:focus{border-color:var(--primary)}
.qty-row{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.qty-btn{width:44px;height:44px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:20px;font-weight:700;cursor:pointer}
.qty-val{flex:1;text-align:center;font-size:18px;font-weight:700;background:var(--card2);padding:11px;border-radius:10px}
.qr-box{background:#fff;padding:14px;border-radius:14px;text-align:center;margin-bottom:14px}
.qr-box img{width:100%;max-width:280px;display:block;margin:0 auto}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-row span:first-child{color:var(--muted)}
.info-row span:last-child{font-weight:600;text-align:right;max-width:60%;word-break:break-word}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.stat-val{font-size:18px;font-weight:700;color:var(--primary);margin-bottom:4px;word-break:break-all}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat-card.gold .stat-val{color:var(--gold)}
.stat-card.green .stat-val{color:var(--success)}
.stat-card.pink .stat-val{color:#ff6b9d}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:50}
.nav-item{flex:1;text-align:center;padding:6px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:500}
.nav-item.active{color:var(--primary)}
.nav-icon{font-size:20px;display:block;margin-bottom:2px}
.loading{text-align:center;padding:40px;color:var(--muted)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--card);border:1px solid var(--border);padding:12px 20px;border-radius:12px;font-size:13px;z-index:200;transition:.3s;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--success)}
.toast.error{border-color:var(--danger)}
.code-box{background:#000;color:var(--success);padding:12px;border-radius:10px;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow-y:auto;margin-bottom:10px;line-height:1.5}
.badge-admin{background:linear-gradient(135deg,#ffd700,#f0a500);color:#000;font-size:10px;padding:2px 8px;border-radius:6px;font-weight:700;margin-left:6px}
</style>
</head>
<body>

<!-- CẤU HÌNH API BASE - ĐỔI THÀNH URL TUNNEL CỦA BẠN -->
<script>
  const API_BASE = "https://oppressed-hatchback-bobtail.ngrok-free.dev";
</script>

<div class="header">
  <div class="logo">⚡ Proxy Shop</div>
  <div class="balance-badge">💰 <span id="hdrBal">0đ</span></div>
</div>

<!-- TRANG SHOP -->
<div class="page active" id="page-shop">
  <div class="section-title">🛍 Danh sách Proxy</div>
  <div class="tabs">
    <div class="tab active" onclick="loadProducts(this)">Tất cả</div>
    <div class="tab" onclick="loadProducts(this,true)">Làm mới</div>
  </div>
  <div id="productsList"><div class="loading"><div class="spinner"></div>Đang tải...</div></div>
</div>

<!-- TRANG ĐƠN HÀNG -->
<div class="page" id="page-orders">
  <div class="section-title">📦 Proxy đã mua</div>
  <div id="ordersList"><div class="loading"><div class="spinner"></div>Đang tải...</div></div>
</div>

<!-- TRANG NẠP TIỀN -->
<div class="page" id="page-deposit">
  <div class="section-title">💳 Nạp tiền tự động</div>
  <div class="card">
    <div style="margin-bottom:10px;color:var(--muted);font-size:13px">Nhập số tiền muốn nạp (tối thiểu 1,000đ). Hệ thống sẽ tạo mã QR tự động và duyệt ngay khi nhận được tiền.</div>
    <input class="input" id="depAmount" type="number" placeholder="Số tiền (VD: 50000)" inputmode="numeric">
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn btn-outline btn-sm" onclick="setAmt(10000)">10K</button>
      <button class="btn btn-outline btn-sm" onclick="setAmt(20000)">20K</button>
      <button class="btn btn-outline btn-sm" onclick="setAmt(50000)">50K</button>
      <button class="btn btn-outline btn-sm" onclick="setAmt(100000)">100K</button>
      <button class="btn btn-outline btn-sm" onclick="setAmt(200000)">200K</button>
    </div>
    <button class="btn btn-success btn-block" onclick="createDeposit()">🎯 Tạo QR thanh toán</button>
  </div>
</div>

<!-- TRANG ADMIN -->
<div class="page" id="page-admin">
  <div class="section-title">👑 Admin Panel</div>
  <div class="stats-grid" id="adminStats"></div>
  <div class="tabs" style="margin-top:14px">
    <div class="tab active" onclick="adminTab('users',this)">👥 Users</div>
    <div class="tab" onclick="adminTab('orders',this)">🛒 Đơn hàng</div>
  </div>
  <div id="adminList"></div>
</div>

<!-- NAV -->
<div class="nav">
  <div class="nav-item active" data-page="shop" onclick="nav('shop')"><span class="nav-icon">🛍</span>Shop</div>
  <div class="nav-item" data-page="orders" onclick="nav('orders')"><span class="nav-icon">📦</span>Đơn hàng</div>
  <div class="nav-item" data-page="deposit" onclick="nav('deposit')"><span class="nav-icon">💳</span>Nạp tiền</div>
  <div class="nav-item" id="navAdmin" data-page="admin" onclick="nav('admin')" style="display:none"><span class="nav-icon">👑</span>Admin</div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
let INIT_DATA = "";
let USER = null;
let PRODUCTS = [];
let currentProduct = null;
let depositPolling = null;

if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor?.("#0f1117"); tg.setBackgroundColor?.("#0f1117"); }
INIT_DATA = tg?.initData || "";

function toast(msg, type="success") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show " + type;
  setTimeout(() => el.className = "toast " + type, 2600);
}

async function api(path, data={}) {
  const res = await fetch(API_BASE + path, {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-Init-Data": INIT_DATA},
    body: JSON.stringify({...data, initData: INIT_DATA})
  });
  return res.json();
}

function fmt(n) { return (n||0).toLocaleString("vi-VN") + "đ"; }

async function init() {
  try {
    const r = await api("/api/auth");
    if (!r.ok) { toast("Xác thực thất bại", "error"); return; }
    USER = r.user;
    document.getElementById("hdrBal").textContent = fmt(USER.balance);
    if (USER.is_admin) document.getElementById("navAdmin").style.display = "block";
    loadProducts();
    loadOrders();
  } catch(e) {
    toast("Lỗi kết nối server", "error");
    console.error(e);
  }
}

function nav(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  document.getElementById("page-" + page).classList.add("active");
  document.querySelector(`.nav-item[data-page="${page}"]`).classList.add("active");
  if (page === "orders") loadOrders();
  if (page === "admin") loadAdmin();
}

function closeModal() { document.getElementById("modalBg").classList.remove("active"); }
function openModal(html) {
  document.getElementById("modalContent").innerHTML = html;
  document.getElementById("modalBg").classList.add("active");
}

async function loadProducts(el, force) {
  const list = document.getElementById("productsList");
  list.innerHTML = '<div class="loading"><div class="spinner"></div>Đang tải...</div>';
  try {
    const r = await api("/api/products");
    if (!r.ok) { list.innerHTML = '<div class="empty">Lỗi tải sản phẩm</div>'; return; }
    PRODUCTS = r.products || [];
    if (!PRODUCTS.length) { list.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>Chưa có sản phẩm</div>'; return; }
    list.innerHTML = PRODUCTS.map(p => `
      <div class="card" onclick="openBuy('${p.id}')">
        <div class="product-head">
          <div class="product-name">${p.name}</div>
          <div class="stock-tag">${p.stock} có sẵn</div>
        </div>
        ${p.desc ? `<div class="product-desc">${p.desc}</div>` : ""}
        <div class="product-foot">
          <div class="price">${fmt(p.price)} <small>/ proxy</small></div>
          <button class="btn btn-sm">Mua ngay</button>
        </div>
      </div>
    `).join("");
  } catch(e) {
    list.innerHTML = '<div class="empty">Lỗi kết nối</div>';
  }
}

function openBuy(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  currentProduct = p;
  openModal(`
    <div class="modal-title">${p.name}<button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="info-row"><span>Giá</span><span>${fmt(p.price)}</span></div>
    <div class="info-row"><span>Tồn kho</span><span>${p.stock}</span></div>
    <div class="info-row"><span>Số dư</span><span>${fmt(USER.balance)}</span></div>
    <div style="margin:14px 0 8px;font-weight:600;font-size:13px">Số lượng</div>
    <div class="qty-row">
      <button class="qty-btn" onclick="changeQty(-1)">−</button>
      <div class="qty-val" id="buyQty">1</div>
      <button class="qty-btn" onclick="changeQty(1)">+</button>
    </div>
    <div class="info-row"><span>Tổng tiền</span><span id="buyTotal">${fmt(p.price)}</span></div>
    <button class="btn btn-success btn-block" style="margin-top:14px" onclick="doBuy()">✅ Xác nhận mua</button>
  `);
  window._qty = 1;
}

function changeQty(d) {
  window._qty = Math.max(1, (window._qty || 1) + d);
  document.getElementById("buyQty").textContent = window._qty;
  document.getElementById("buyTotal").textContent = fmt(currentProduct.price * window._qty);
}

async function doBuy() {
  const qty = window._qty || 1;
  const btn = event.target;
  btn.disabled = true; btn.textContent = "Đang xử lý...";
  try {
    const r = await api("/api/buy", {id: currentProduct.id, amount: qty});
    if (!r.ok) { toast(r.error || "Lỗi", "error"); btn.disabled = false; btn.textContent = "✅ Xác nhận mua"; return; }
    USER.balance -= r.paid;
    document.getElementById("hdrBal").textContent = fmt(USER.balance);
    toast("Mua thành công!", "success");
    closeModal();
    setTimeout(() => showPurchased(r.proxy_data, r.order_code), 300);
    loadOrders();
  } catch(e) {
    toast("Lỗi kết nối", "error");
    btn.disabled = false; btn.textContent = "✅ Xác nhận mua";
  }
}

function showPurchased(data, code) {
  openModal(`
    <div class="modal-title">🎉 Mua thành công<button class="close-x" onclick="closeModal()">✕</button></div>
    ${code ? `<div class="info-row"><span>Mã đơn</span><span>${code}</span></div>` : ""}
    <div style="margin:10px 0;font-size:13px;color:var(--muted)">Dữ liệu proxy của bạn:</div>
    <div class="code-box">${escapeHtml(data || "(không có dữ liệu)")}</div>
    <button class="btn btn-block" onclick="copyData()">📋 Copy</button>
  `);
  window._copyData = data || "";
}

function copyData() {
  const t = window._copyData || "";
  navigator.clipboard.writeText(t).then(() => toast("Đã copy!", "success"));
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function loadOrders() {
  const list = document.getElementById("ordersList");
  list.innerHTML = '<div class="loading"><div class="spinner"></div>Đang tải...</div>';
  try {
    const r = await api("/api/my-orders");
    if (!r.ok || !r.orders.length) {
      list.innerHTML = '<div class="empty"><div class="empty-icon">📦</div>Chưa có đơn hàng nào</div>'; return;
    }
    list.innerHTML = r.orders.map(o => `
      <div class="card">
        <div class="product-head">
          <div class="product-name">${escapeHtml(o.name)}</div>
          <div class="stock-tag">SL: ${o.amount}</div>
        </div>
        <div class="info-row"><span>Thời gian</span><span>${o.created_at}</span></div>
        <div class="info-row"><span>Thanh toán</span><span>${fmt(o.price)}</span></div>
        ${o.order_code ? `<div class="info-row"><span>Mã đơn</span><span>${o.order_code}</span></div>` : ""}
        <button class="btn btn-sm" style="margin-top:10px;width:100%" onclick='viewOrder(${JSON.stringify(JSON.stringify(o.proxy_data))})'>👁 Xem proxy</button>
      </div>
    `).join("");
  } catch(e) {
    list.innerHTML = '<div class="empty">Lỗi tải đơn hàng</div>';
  }
}

function viewOrder(dataJson) {
  const data = JSON.parse(dataJson || '""');
  openModal(`
    <div class="modal-title">👁 Proxy của bạn<button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="code-box">${escapeHtml(data || "(không có dữ liệu)")}</div>
    <button class="btn btn-block" onclick='navigator.clipboard.writeText(${JSON.stringify(data||"")}).then(()=>toast("Đã copy!"))'>📋 Copy</button>
  `);
}

function setAmt(n) { document.getElementById("depAmount").value = n; }

async function createDeposit() {
  const amt = parseInt(document.getElementById("depAmount").value || "0");
  if (amt < 1000) { toast("Tối thiểu 1,000đ", "error"); return; }
  try {
    const r = await api("/api/deposit", {amount: amt});
    if (!r.ok) { toast(r.error || "Lỗi", "error"); return; }
    openModal(`
      <div class="modal-title">💳 Quét QR để nạp<button class="close-x" onclick="closeDeposit()">✕</button></div>
      <div class="qr-box"><img src="${r.qr}" alt="QR"></div>
      <div class="info-row"><span>Ngân hàng</span><span>${r.bank}</span></div>
      <div class="info-row"><span>Số TK</span><span>${r.account_no}</span></div>
      <div class="info-row"><span>Chủ TK</span><span>${r.account_name}</span></div>
      <div class="info-row"><span>Số tiền</span><span>${fmt(r.amount)}</span></div>
      <div class="info-row"><span>Nội dung</span><span style="color:var(--gold)">${r.content}</span></div>
      <div style="text-align:center;margin-top:14px;font-size:12px;color:var(--muted)">⏳ Đang chờ thanh toán... Hệ thống sẽ tự động duyệt</div>
    `);
    startDepositPoll(r.code);
  } catch(e) {
    toast("Lỗi kết nối", "error");
  }
}

function startDepositPoll(code) {
  if (depositPolling) clearInterval(depositPolling);
  depositPolling = setInterval(async () => {
    try {
      const r = await api("/api/deposit/check", {code});
      if (r.ok && r.status === "paid") {
        clearInterval(depositPolling);
        depositPolling = null;
        USER.balance = r.balance;
        document.getElementById("hdrBal").textContent = fmt(r.balance);
        closeModal();
        toast("✅ Nạp tiền thành công!", "success");
      }
    } catch(e) {}
  }, 4000);
}

function closeDeposit() {
  if (depositPolling) { clearInterval(depositPolling); depositPolling = null; }
  closeModal();
}

// ========== ADMIN ==========
async function loadAdmin() {
  try {
    const r = await api("/api/admin/stats");
    if (!r.ok) return;
    const s = r.stats;
    document.getElementById("adminStats").innerHTML = `
      <div class="stat-card gold"><div class="stat-val">${fmt(s.today_revenue)}</div><div class="stat-label">Doanh thu hôm nay</div></div>
      <div class="stat-card green"><div class="stat-val">${fmt(s.today_profit)}</div><div class="stat-label">Lợi nhuận hôm nay</div></div>
      <div class="stat-card"><div class="stat-val">${fmt(s.week_revenue)}</div><div class="stat-label">Tuần này</div></div>
      <div class="stat-card"><div class="stat-val">${fmt(s.month_revenue)}</div><div class="stat-label">30 ngày</div></div>
      <div class="stat-card pink"><div class="stat-val">${fmt(s.total_profit)}</div><div class="stat-label">Tổng lợi nhuận</div></div>
      <div class="stat-card gold"><div class="stat-val">${fmt(s.total_revenue)}</div><div class="stat-label">Tổng doanh thu</div></div>
      <div class="stat-card"><div class="stat-val">${s.total_orders}</div><div class="stat-label">Tổng đơn</div></div>
      <div class="stat-card green"><div class="stat-val">${s.total_proxy_sold}</div><div class="stat-label">Proxy đã bán</div></div>
      <div class="stat-card"><div class="stat-val">${s.total_users}</div><div class="stat-label">Khách đã ghé</div></div>
      <div class="stat-card pink"><div class="stat-val">${fmt(s.total_deposit)}</div><div class="stat-label">Tổng nạp</div></div>
    `;
    adminTab("users");
  } catch(e) { toast("Lỗi tải admin", "error"); }
}

async function adminTab(tab, el) {
  if (el) { document.querySelectorAll("#page-admin .tab").forEach(t => t.classList.remove("active")); el.classList.add("active"); }
  const box = document.getElementById("adminList");
  box.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    if (tab === "users") {
      const r = await api("/api/admin/users");
      if (!r.ok) { box.innerHTML = ""; return; }
      box.innerHTML = r.users.map(u => `
        <div class="card">
          <div class="product-head">
            <div class="product-name">${escapeHtml(u.first_name || u.username || "User")}</div>
            <div class="stock-tag">💰 ${fmt(u.balance)}</div>
          </div>
          <div class="info-row"><span>ID</span><span>${u.id}</span></div>
          ${u.username ? `<div class="info-row"><span>@</span><span>${u.username}</span></div>` : ""}
          <div class="info-row"><span>Đã chi</span><span>${fmt(u.total_spent)}</span></div>
          <div class="info-row"><span>Proxy đã mua</span><span>${u.total_proxy}</span></div>
          <div class="info-row"><span>Lần cuối</span><span>${u.last_seen || ""}</span></div>
        </div>
      `).join("") || '<div class="empty">Chưa có user</div>';
    } else {
      const r = await api("/api/admin/orders");
      if (!r.ok) { box.innerHTML = ""; return; }
      box.innerHTML = r.orders.map(o => `
        <div class="card">
          <div class="product-head">
            <div class="product-name">${escapeHtml(o.name)}</div>
            <div class="stock-tag">SL: ${o.amount}</div>
          </div>
          <div class="info-row"><span>User</span><span>${escapeHtml(o.first_name || o.username || o.user_id)}</span></div>
          <div class="info-row"><span>Thanh toán</span><span>${fmt(o.price)}</span></div>
          <div class="info-row"><span>Vốn</span><span>${fmt(o.cost)}</span></div>
          <div class="info-row"><span>Lãi</span><span style="color:var(--success)">${fmt(o.price - o.cost)}</span></div>
          <div class="info-row"><span>Thời gian</span><span>${o.created_at}</span></div>
        </div>
      `).join("") || '<div class="empty">Chưa có đơn</div>';
    }
  } catch(e) { box.innerHTML = '<div class="empty">Lỗi tải</div>'; }
}

init();
</script>
</body>
</html>
